# MetaShield Application Configuration
# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring MVC & Multipart Settings
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# SQLite DataSource (Pure SQLite relational constraint)
spring.datasource.url=jdbc:sqlite:data/metashield.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# MetaShield System Properties
metashield.institution=Malla Reddy University
metashield.department=Computer Science & Engineering
metashield.batch=CS BETA - 17
metashield.developers=Charan Konda (2511CS040113) & J. Naga Phani (2511CS040132)

# Session TTL (in seconds, 1 hour = 3600)
metashield.retention.ttl-seconds=3600
metashield.retention.purge-cron=0 */10 * * * *

# Cross-platform relative storage paths
metashield.storage.base-dir=temp/staging
metashield.engine.python-cmd=python
metashield.engine.python-daemon=engine/daemon_server.py
metashield.engine.stream-guard=engine/stream_guard.exe
